name: Atualizar painel do perfil

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_profile.py
      - .github/workflows/profile.yml
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: python3 scripts/render_profile.py
      - name: Publicar os gráficos quando houver mudanças
        run: |
          git add assets/atividade.svg assets/cobrinha.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualizar gráficos do perfil [skip ci]'
          git pull --rebase
          git push
